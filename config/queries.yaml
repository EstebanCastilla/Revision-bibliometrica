# =============================================================================
# Estrategia de búsqueda jerárquica (de lo general a lo específico)
# Revisión bibliométrica - Biorrefinería integrada de ñame y batata
# -----------------------------------------------------------------------------
# Las consultas se ejecutan contra la API REST de OpenAlex
# (https://api.openalex.org/works) usando el filtro `title_and_abstract.search`,
# que admite operadores booleanos (AND, OR, NOT, paréntesis y frases entre
# comillas) y aplica stemming (p. ej. "biorefinery" recupera "biorefineries").
# La sintaxis equivalente para Scopus (TITLE-ABS-KEY) se incluye en `scopus`
# para replicar la búsqueda con la Scopus Search API o con exportaciones CSV.
# =============================================================================

global:
  from_year: 2000
  to_year: 2026          # 2026 es un año parcial (fecha de corte en metadata)
  types: [article, review]
  per_page: 200
  max_records: 30000     # tope de seguridad por consulta

levels:
  # ---------------------------------------------------------------------------
  - id: N1
    name: "Evaluación de sostenibilidad de biorrefinerías (marco general)"
    description: >
      Literatura sobre biorrefinerías evaluadas con ACV, TEA, ACV-S o
      evaluación de sostenibilidad. Define el marco metodológico general.
    openalex: >-
      (biorefinery OR biorefineries OR "integrated biorefinery") AND
      ("life cycle assessment" OR "life cycle analysis" OR "techno-economic" OR
      "technoeconomic" OR "economic feasibility" OR "sustainability assessment" OR
      "social life cycle" OR "life cycle sustainability")
    scopus: >-
      TITLE-ABS-KEY(biorefiner* AND ("life cycle assessment" OR "life cycle analysis" OR
      "techno-economic" OR technoeconomic OR "economic feasibility" OR
      "sustainability assessment" OR "social life cycle" OR "life cycle sustainability"))

  # ---------------------------------------------------------------------------
  - id: N2
    name: "Evaluación integrada de tres pilares (ACV + TEA + ACV-S / LCSA)"
    description: >
      Trabajos que incorporan la dimensión social (ACV-S) o el marco de
      Evaluación de Sostenibilidad del Ciclo de Vida (LCSA) en sistemas
      de base biológica.
    openalex: >-
      (biorefinery OR biorefineries OR bioeconomy OR "bio-based" OR biofuel OR bioenergy) AND
      ("social life cycle assessment" OR "social life cycle analysis" OR "S-LCA" OR "social LCA" OR
      "life cycle sustainability assessment" OR "LCSA")
    scopus: >-
      TITLE-ABS-KEY((biorefiner* OR bioeconomy OR "bio-based" OR biofuel* OR bioenergy) AND
      ("social life cycle assessment" OR "social life cycle analysis" OR "S-LCA" OR "social LCA" OR
      "life cycle sustainability assessment" OR LCSA))

  # ---------------------------------------------------------------------------
  - id: N3
    name: "Raíces y tubérculos como materia prima de bioprocesos"
    description: >
      Valorización de cultivos de raíces y tubérculos (yuca, papa, ñame,
      batata, malanga/taro) hacia biocombustibles, bioproductos y biorrefinerías.
    openalex: >-
      (cassava OR manioc OR yam OR yams OR Dioscorea OR "sweet potato" OR "sweet potatoes" OR
      potato OR potatoes OR taro OR cocoyam OR "root crop" OR "root crops" OR "tuber crop" OR "tuber crops") AND
      (biorefinery OR bioethanol OR "ethanol production" OR "ethanol fermentation" OR "fuel ethanol" OR
      biogas OR "anaerobic digestion" OR biomethane OR biofertilizer OR "bio-fertilizer" OR
      valorization OR valorisation OR "life cycle assessment" OR "techno-economic")
    scopus: >-
      TITLE-ABS-KEY((cassava OR manioc OR yam OR yams OR dioscorea OR "sweet potato*" OR potato* OR taro OR
      cocoyam OR "root crop*" OR "tuber crop*") AND (biorefiner* OR bioethanol OR "ethanol production" OR
      "ethanol fermentation" OR "fuel ethanol" OR biogas OR "anaerobic digestion" OR biomethane OR
      biofertili* OR valori* OR "life cycle assessment" OR "techno-economic"))

  # ---------------------------------------------------------------------------
  - id: N4
    name: "Ñame y batata: rutas de transformación"
    description: >
      Corpus específico de ñame (Dioscorea spp.) y batata (Ipomoea batatas)
      para las rutas fijas de la biorrefinería y los metabolitos candidatos.
      Se compone de sub-consultas por ruta (N4a-N4g) que luego se unen.
    sublevels:
      - id: N4a
        route: "Almidón nativo"
        openalex: >-
          (yam OR yams OR Dioscorea OR "sweet potato" OR "sweet potatoes" OR "Ipomoea batatas") AND
          (starch) AND (extraction OR isolation OR "native starch" OR yield OR physicochemical OR
          characterization OR properties OR industrial)
        scopus: >-
          TITLE-ABS-KEY((yam OR yams OR dioscorea OR "sweet potato*" OR "Ipomoea batatas") AND starch AND
          (extraction OR isolation OR "native starch" OR yield OR physicochemical OR characteri* OR properties OR industrial))
      - id: N4b
        route: "Bioetanol"
        openalex: >-
          (yam OR yams OR Dioscorea OR "sweet potato" OR "sweet potatoes" OR "Ipomoea batatas") AND
          (bioethanol OR "ethanol production" OR "ethanol fermentation" OR "fuel ethanol" OR
          "ethanol yield" OR biofuel)
        scopus: >-
          TITLE-ABS-KEY((yam OR yams OR dioscorea OR "sweet potato*" OR "Ipomoea batatas") AND
          (bioethanol OR "ethanol production" OR "ethanol fermentation" OR "fuel ethanol" OR "ethanol yield" OR biofuel*))
      - id: N4c
        route: "Biogás"
        openalex: >-
          (yam OR yams OR Dioscorea OR "sweet potato" OR "sweet potatoes" OR "Ipomoea batatas") AND
          (biogas OR "anaerobic digestion" OR "anaerobic co-digestion" OR biomethane OR
          "methane yield" OR "methane production" OR "biochemical methane potential")
        scopus: >-
          TITLE-ABS-KEY((yam OR yams OR dioscorea OR "sweet potato*" OR "Ipomoea batatas") AND
          (biogas OR "anaerobic digestion" OR "anaerobic co-digestion" OR biomethane OR "methane yield" OR
          "methane production" OR "biochemical methane potential"))
      - id: N4d
        route: "Biofertilizante"
        openalex: >-
          (yam OR yams OR Dioscorea OR "sweet potato" OR "sweet potatoes" OR "Ipomoea batatas") AND
          (peel OR peels OR residue OR residues OR waste OR wastes OR "by-product" OR "by-products" OR
          byproduct OR vine OR vines OR digestate) AND
          (biofertilizer OR "bio-fertilizer" OR compost OR composting OR vermicompost OR
          "organic fertilizer" OR biochar OR "soil amendment")
        scopus: >-
          TITLE-ABS-KEY((yam OR yams OR dioscorea OR "sweet potato*" OR "Ipomoea batatas") AND
          (peel* OR residue* OR waste* OR "by-product*" OR byproduct* OR vine* OR digestate) AND
          (biofertili* OR "bio-fertili*" OR compost* OR vermicompost OR "organic fertili*" OR biochar OR "soil amendment"))
      - id: N4e
        route: "Metabolitos del ñame"
        openalex: >-
          (yam OR yams OR Dioscorea) AND
          (diosgenin OR dioscorin OR allantoin OR saponin OR saponins OR polyphenol OR polyphenols OR
          phenolic OR flavonoid OR flavonoids OR mucilage OR "non-starch polysaccharide" OR
          polysaccharide OR polysaccharides OR "bioactive compound" OR "bioactive compounds" OR
          "resistant starch" OR batatasin OR dihydrodioscorine OR carotenoid OR carotenoids)
        scopus: >-
          TITLE-ABS-KEY((yam OR yams OR dioscorea) AND (diosgenin OR dioscorin OR allantoin OR saponin* OR
          polyphenol* OR phenolic* OR flavonoid* OR mucilage OR polysaccharide* OR "bioactive compound*" OR
          "resistant starch" OR batatasin* OR dioscorine OR carotenoid*))
      - id: N4f
        route: "Metabolitos de la batata"
        openalex: >-
          ("sweet potato" OR "sweet potatoes" OR "Ipomoea batatas") AND
          (anthocyanin OR anthocyanins OR "chlorogenic acid" OR "caffeoylquinic" OR "beta-carotene" OR
          "β-carotene" OR carotenoid OR carotenoids OR sporamin OR polyphenol OR polyphenols OR phenolic OR
          flavonoid OR flavonoids OR pectin OR "dietary fiber" OR "resistant starch" OR "bioactive compound" OR
          "bioactive compounds" OR "protein isolate")
        scopus: >-
          TITLE-ABS-KEY(("sweet potato*" OR "Ipomoea batatas") AND (anthocyanin* OR "chlorogenic acid" OR
          caffeoylquinic OR "beta-carotene" OR carotenoid* OR sporamin OR polyphenol* OR phenolic* OR
          flavonoid* OR pectin OR "dietary fiber" OR "resistant starch" OR "bioactive compound*" OR "protein isolate"))
      - id: N4g
        route: "Biorrefinería / valorización integral"
        openalex: >-
          (yam OR yams OR Dioscorea OR "sweet potato" OR "sweet potatoes" OR "Ipomoea batatas") AND
          (biorefinery OR biorefineries OR valorization OR valorisation OR "circular economy" OR
          "zero waste" OR "integrated process" OR "cascade")
        scopus: >-
          TITLE-ABS-KEY((yam OR yams OR dioscorea OR "sweet potato*" OR "Ipomoea batatas") AND
          (biorefiner* OR valori* OR "circular economy" OR "zero waste" OR "integrated process" OR cascad*))

  # ---------------------------------------------------------------------------
  - id: N5
    name: "Sostenibilidad de sistemas productivos de ñame y batata"
    description: >
      ACV, TEA, ACV-S, huella de carbono y viabilidad económica aplicados a
      cultivos o productos de ñame y batata.
    openalex: >-
      (yam OR yams OR Dioscorea OR "sweet potato" OR "sweet potatoes" OR "Ipomoea batatas") AND
      ("life cycle assessment" OR "life cycle analysis" OR "LCA" OR "techno-economic" OR
      "economic feasibility" OR "economic analysis" OR "profitability" OR "social life cycle" OR
      "carbon footprint" OR "environmental impact" OR "sustainability assessment" OR "value chain")
    scopus: >-
      TITLE-ABS-KEY((yam OR yams OR dioscorea OR "sweet potato*" OR "Ipomoea batatas") AND
      ("life cycle assessment" OR "life cycle analysis" OR LCA OR "techno-economic" OR "economic feasibility" OR
      "economic analysis" OR profitability OR "social life cycle" OR "carbon footprint" OR
      "environmental impact" OR "sustainability assessment" OR "value chain"))

  # ---------------------------------------------------------------------------
  - id: N6
    name: "Contexto territorial: ñame y batata en Colombia"
    description: >
      Producción científica sobre ñame y batata con referencia explícita a
      Colombia o a Montes de María. Nota: el término "ñame" no se usa en
      OpenAlex porque el stemming elimina la tilde y lo convierte en "name",
      lo que recupera miles de falsos positivos (verificado el 2026-10-29).
      Scopus aplica la misma normalización (837 registros con "ñame", la
      mayoría sin relación), por lo que tampoco se usa en la cadena Scopus.
    openalex: >-
      (yam OR yams OR Dioscorea OR "sweet potato" OR "sweet potatoes" OR batata OR "Ipomoea batatas") AND
      (Colombia OR Colombian OR "Montes de María" OR "Montes de Maria")
    scopus: >-
      TITLE-ABS-KEY((yam OR yams OR dioscorea OR "sweet potato*" OR batata OR "Ipomoea batatas") AND
      (colombia* OR "Montes de María" OR "Montes de Maria"))
  - id: N6c
    name: "Contexto territorial: bioprocesos con raíces, tubérculos y residuos agroindustriales en Colombia"
    description: >
      Biorrefinerías, bioetanol, biogás, biofertilizantes y evaluaciones de
      sostenibilidad a partir de yuca, ñame, batata, almidón o residuos
      agroindustriales en Colombia.
    openalex: >-
      (biorefinery OR biorefineries OR "biorrefinería" OR bioethanol OR biogas OR "anaerobic digestion" OR
      biofertilizer OR "life cycle assessment" OR "techno-economic") AND
      (cassava OR yuca OR yam OR "sweet potato" OR "agro-industrial" OR agroindustrial OR "crop residues" OR starch) AND
      (Colombia OR Colombian)
    scopus: >-
      TITLE-ABS-KEY((biorefiner* OR biorrefiner* OR bioethanol OR biogas OR "anaerobic digestion" OR
      biofertili* OR "life cycle assessment" OR "techno-economic") AND
      (cassava OR yuca OR yam OR yams OR "sweet potato*" OR "agro-industrial" OR agroindustrial OR "crop residue*" OR starch) AND
      (colombia*))
  - id: N6b
    name: "Biorrefinerías evaluadas por instituciones colombianas"
    description: >
      Misma consulta de N1 restringida a autores con afiliación en Colombia
      (filtro institutions.country_code:co de OpenAlex).
    openalex: >-
      (biorefinery OR biorefineries OR "integrated biorefinery") AND
      ("life cycle assessment" OR "life cycle analysis" OR "techno-economic" OR
      "technoeconomic" OR "economic feasibility" OR "sustainability assessment" OR
      "social life cycle" OR "life cycle sustainability")
    extra_filter: "institutions.country_code:co"
    scopus: >-
      TITLE-ABS-KEY(biorefiner* AND ("life cycle assessment" OR "techno-economic" OR
      "sustainability assessment" OR "social life cycle")) AND AFFILCOUNTRY(colombia)
